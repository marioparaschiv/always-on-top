[package]
name = "always-on-top"
version = "0.3.1"
edition = "2021"

[dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_Activation",
    "Foundation",
    "Graphics",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "UI_Core",
    "UI_Text",
] }
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
panic = "abort"
strip = true
